# keypool bundle patch — applied as a profile bundle layer, after
# @deepseek-ai/dsh-base (which defines `id: credentials`). Later layers win by
# id, but the bundle mechanism guards row overrides by name: you cannot rebind
# an existing row's `name` to a different package. So instead of overriding the
# `credentials` row, disable it and insert keypool as a fresh row — exactly the
# pattern the home overlay used before keypool was bundle-ified.
#
# keypool subclasses the file-backed provider, so path/watch and every non-pool
# reference behave exactly as @deepseek-ai/dsh-credentials-local; only pool
# references rotate. The pool rotates QWEN_API_KEY over five interchangeable
# member keys stored in $DSH_HOME/.credentials.yaml under round_robin; each
# credential resolution hands the next member to the request. KEY_6 (401 dead)
# and KEY_8 (dup of KEY_1) are permanently excluded, not just disabled, so a
# round-robin pass never lands on an unconfigured member. KEY_3 was pulled on
# 2026-09-12 after live-testing every member directly against DashScope (curl
# the chat/completions endpoint with each key) surfaced a real 401
# invalid_api_key on it — it isn't a stale/unconfigured slot like _6/_8, the
# key itself has been revoked/expired upstream since this pool was last
# trimmed. Trusting old "known-bad" comments without re-testing every member
# live is what let this slip through the previous fix; don't repeat that.
#
# The inserted row below carries an explicit `id` (not just `name`) so a later
# id-targeted cordis.patch.yml override can actually match it — applyEntryPatches
# only indexes entries that already have an `id`; an id-less insert is
# unaddressable by any subsequent patch (confirmed by a silently-dropped
# profile-level override that tried to target this row by package name before
# an explicit id existed here).
- id: credentials
  disabled: true
- insert:
    - id: '@deepseek-ai/dsh-credentials-keypool'
      name: '@deepseek-ai/dsh-credentials-keypool'
      config:
        pools:
          QWEN_API_KEY:
            policy: round_robin
            members:
              - QWEN_API_KEY_1
              - QWEN_API_KEY_2
              - QWEN_API_KEY_4
              - QWEN_API_KEY_5
              - QWEN_API_KEY_7
